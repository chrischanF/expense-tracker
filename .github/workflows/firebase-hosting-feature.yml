name: Deploy feature branch to Firebase Hosting
on:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create Firebase channel ID
        id: channel
        run: |
          branch_slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          echo "id=feature-${branch_slug}" >> "$GITHUB_OUTPUT"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXPENSE_TRACKER_A6042 }}
          channelId: ${{ steps.channel.outputs.id }}
          expires: 30d
          projectId: expense-tracker-a6042
