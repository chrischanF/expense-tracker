<app-loader
  [active]="firestoreBusy()"
  [message]="firestoreLoaderMessage()"
/>

<div class="dashboard-layout">
  <app-dashboard-header />

  <app-dashboard-planning
    [safeToSpend]="safeToSpendPlan()"
    [safeToSpendAmount]="safeToSpendAmount()"
    [safeToSpendRatio]="safeToSpendRatio()"
    [allowancePeriod]="allowancePeriod()"
    [incomeProfile]="incomeProfile()"
    [paydayAmount]="activePayPeriod()?.amount ?? incomeProfile().amount"
    [exchangeRateLoading]="exchangeRates.isLoading()"
    [exchangeRateError]="exchangeRates.error()"
    (allowancePeriodChange)="allowancePeriod.set($event)"
  />

  <app-dashboard-wallets
    [balances]="walletBalances()"
    [selectedWalletId]="walletService.selectedWalletId()"
    [selectedWalletName]="walletService.selectedWallet()?.name ?? null"
    (walletSelected)="walletService.selectWallet($event)"
  />

  <app-dashboard-insights
    [monthlyExpenses]="baseMonthExpenses()"
    [trendExpenses]="trendExpenses()"
    [monthlyIncome]="monthlyIncome()"
  />

  <div class="dashboard-lower-grid">
    <app-dashboard-budgets [budgets]="budgetProgress()" />
    <app-dashboard-reminders
      [bills]="upcomingBills()"
      [remindersSupported]="billReminders.isSupported()"
      [reminderPermission]="billReminders.permission()"
      (enableReminders)="enableBillReminders()"
    />
    <app-dashboard-goals [goals]="savingsGoals()" />
    <app-dashboard-activity [expenses]="recentExpenses()" />
  </div>
</div>
